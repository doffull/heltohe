project_id = "hzjzqdlyehclnpeqkier"

[auth]
  [auth.password]
    hibp_enabled = true
    min_length = 6

[functions]
  [functions.analyze-product-image]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.boutique-lookup]
    verify_jwt = false
  # Statuts transporteur entrants : appelée par le transporteur, sans session.
  # Se protège par un jeton partagé (payment_gateway_secrets.carrier_webhook, à
  # défaut CARRIER_WEBHOOK_TOKEN) et refuse tout si ce jeton n'est pas défini.
  [functions.carrier-tracking-webhook]
    verify_jwt = false
  [functions.colissimo-proxy]
    verify_jwt = false
  [functions.contact-chat]
    verify_jwt = false
  [functions.fetch-sitemap]
    verify_jwt = false
  [functions.generate-cta-style]
    verify_jwt = false
  [functions.generate-product-description]
    verify_jwt = false
  [functions.generate-product-video]
    verify_jwt = false
  [functions.generate-slide-image]
    verify_jwt = false
  [functions.generate-slide-text]
    verify_jwt = false
  [functions.image-pose-edit]
    verify_jwt = false
  # Sert la clé Google Maps au navigateur : appelée avant toute connexion.
  [functions.maps-config]
    verify_jwt = false
  # Double opt-in : le visiteur clique le lien depuis sa boîte mail, sans session.
  [functions.newsletter-confirm]
    verify_jwt = false
  # Inscription newsletter depuis le site public.
  [functions.newsletter-subscribe]
    verify_jwt = false
  [functions.parse-products-pdf]
    verify_jwt = false
  [functions.parse-stock-pdf]
    verify_jwt = false
  # Mot de passe oublié : par nature appelée sans session. La fonction se
  # protège elle-même — réponse neutre quelle que soit l'adresse, IP hachée,
  # 3 demandes par quart d'heure.
  [functions.password-reset-request]
    verify_jwt = false
  # Webhook PayPal : appelé par PayPal, qui ne peut présenter aucun JWT. La
  # fonction fait vérifier la signature par PayPal lui-même
  # (/v1/notifications/verify-webhook-signature) avant d'appliquer l'événement.
  [functions.paypal-webhook]
    verify_jwt = false
  # IPN PayPlug — même adresse que la création de paiement (notification_url,
  # index.ts:263). Sans cette ligne, Supabase répondait 401
  # UNAUTHORIZED_NO_AUTH_HEADER avant d'atteindre le code : un paiement n'était
  # confirmé que si le client revenait sur /checkout, onglet ouvert.
  # Le corps reçu n'est jamais cru sur parole : le paiement est relu chez
  # PayPlug avec la clé secrète, un faux webhook ne mène donc nulle part.
  [functions.payplug]
    verify_jwt = false
  [functions.product-ai-helpers]
    verify_jwt = false
  [functions.recommend-size]
    verify_jwt = false
  [functions.send-order-confirmation]
    verify_jwt = false
  [functions.spin-roulette]
    verify_jwt = false
  [functions.template-from-mockup]
    verify_jwt = false
  [functions.verify-customer-info]
    verify_jwt = false
  [functions.virtual-tryon]
    verify_jwt = false
  [functions.voice-command]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
